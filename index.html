<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Three.js Dental Annotation Editor</title>
    <link rel="stylesheet" href="css/main.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <!-- Toolbar -->
        <div id="toolbar">
            <span class="title">Dental Annotator</span>
            <button id="btn-import">Import Mesh</button>
            <input type="file" id="file-input" accept=".ply,.stl,.obj" style="display:none">
            <div class="separator"></div>
            <button id="btn-undo" title="Ctrl+Z">Undo</button>
            <button id="btn-redo" title="Ctrl+Shift+Z">Redo</button>
            <div class="separator"></div>
            <button id="btn-reset-view">Reset View</button>
            <button id="btn-screenshot">Screenshot</button>
            <span class="info" id="status-info">Ready — drag & drop a PLY/STL/OBJ file to begin</span>
            <span class="credit">CytoArchiLab</span>
        </div>

        <div id="main">
            <!-- 3D Viewport -->
            <div id="viewport"></div>

            <!-- Sidebar -->
            <div id="sidebar">
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" data-tab="dental">Dental</button>
                    <button class="sidebar-tab" data-tab="scene">Scene</button>
                </div>
                <div id="dental-tab" class="sidebar-content active"></div>
                <div id="scene-tab" class="sidebar-content">
                    <div class="scene-panel" id="scene-list">
                        <h3>Scene Objects</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Drop overlay -->
    <div id="drop-overlay">
        <div class="drop-message">Drop PLY / STL / OBJ file to import</div>
    </div>

    <script type="module">
        import { Editor } from './js/Editor.js';
        import { DentalPlugin } from './js/dental/DentalPlugin.js';

        // --- Initialize editor ---
        const editor = new Editor();
        editor.initViewport(document.getElementById('viewport'));

        // --- Initialize dental plugin ---
        const dental = DentalPlugin.init(editor);

        // --- Toolbar ---
        const fileInput = document.getElementById('file-input');
        document.getElementById('btn-import').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                editor.importFile(e.target.files[0]);
                updateStatus(`Imported: ${e.target.files[0].name}`);
            }
            e.target.value = '';
        });

        document.getElementById('btn-undo').addEventListener('click', () => {
            editor.history.undo();
        });

        document.getElementById('btn-redo').addEventListener('click', () => {
            editor.history.redo();
        });

        document.getElementById('btn-reset-view').addEventListener('click', () => {
            editor.setCameraView('front');
        });

        document.getElementById('btn-screenshot').addEventListener('click', () => {
            editor.downloadScreenshot();
        });

        // --- Sidebar tabs ---
        document.querySelectorAll('.sidebar-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.sidebar-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
            });
        });

        // --- Scene panel ---
        function updateSceneList() {
            const list = document.getElementById('scene-list');
            list.innerHTML = '<h3>Scene Objects</h3>';
            editor.scene.children.forEach(obj => {
                if (obj.isLight || obj.isHelper) return;
                const item = document.createElement('div');
                item.className = 'scene-item' + (obj === editor.selected ? ' selected' : '');
                item.innerHTML = `<span class="icon">[M]</span><span class="name">${obj.name || obj.type}</span>`;
                item.addEventListener('click', () => {
                    editor.select(obj);
                    updateSceneList();
                });
                list.appendChild(item);
            });
        }

        editor.signals.sceneGraphChanged.add(updateSceneList);
        editor.signals.objectSelected.add(updateSceneList);

        // --- Drag & Drop ---
        const dropOverlay = document.getElementById('drop-overlay');
        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            dropOverlay.classList.add('visible');
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter <= 0) {
                dropOverlay.classList.remove('visible');
                dragCounter = 0;
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropOverlay.classList.remove('visible');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                editor.importFile(files[0]);
                updateStatus(`Imported: ${files[0].name}`);
            }
        });

        // --- Status ---
        function updateStatus(msg) {
            document.getElementById('status-info').textContent = msg;
        }

        editor.signals.objectAdded.add((obj) => {
            let verts = 0;
            obj.traverse((child) => {
                if (child.isMesh && child.geometry && child.geometry.attributes.position) {
                    verts += child.geometry.attributes.position.count;
                }
            });
            if (verts > 0) {
                updateStatus(`Loaded: ${obj.name || 'mesh'} — ${verts.toLocaleString()} vertices`);
            }
        });

        // Activate brush by default
        dental.setActiveTool('brush');
    </script>
</body>
</html>
